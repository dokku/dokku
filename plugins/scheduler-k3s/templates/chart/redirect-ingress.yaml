{{- /* Emit one Ingress (nginx ingress class) or Middleware + IngressRoute set
       (traefik ingress class) per domain redirect declared via
       proxy:redirect:set. Redirect sources are excluded from the web
       domains, so these objects are the only routes for those hosts. */}}
{{- range $processName, $config := .Values.processes }}
{{- if not (hasKey $config "web") }}
{{- continue }}
{{- end }}
{{- if not (and $config.web.redirects $config.web.port_maps) }}
{{- continue }}
{{- end }}
{{- $scheme := "http" }}
{{- if $config.web.tls.enabled }}
{{- $scheme = "https" }}
{{- end }}
{{- range $rdx, $redirect := $config.web.redirects }}
{{- if eq $.Values.global.network.ingress_class "nginx" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    dokku.com/managed: "true"
    dokku.com/ingress-method: "redirects"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      return {{ $redirect.code }} {{ $scheme }}://{{ $redirect.destination }}$request_uri;
  labels:
    app.kubernetes.io/instance: {{ $.Values.global.app_name }}-{{ $processName }}-redirect-{{ $redirect.slug }}
    app.kubernetes.io/name: {{ $processName }}
    app.kubernetes.io/part-of: {{ $.Values.global.app_name }}
    {{ include "print.labels" (dict "config" $.Values.global "key" "ingress") | indent 4 }}
    {{ include "print.labels" (dict "config" $config "key" "ingress") | indent 4 }}
  name: {{ $.Values.global.app_name }}-{{ $processName }}-redirect-{{ $redirect.slug }}
  namespace: {{ $.Values.global.namespace }}
spec:
  ingressClassName: nginx
  {{- if $config.web.tls.enabled }}
  tls:
    - hosts:
      - {{ $redirect.source | quote }}
      {{- if $config.web.tls.use_imported_cert }}
      secretName: tls-{{ $.Values.global.app_name }}
      {{- else }}
      secretName: tls-{{ $.Values.global.app_name }}-{{ $processName }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $redirect.source | quote }}
      http:
        paths:
          - backend:
              service:
                name: {{ $.Values.global.app_name }}-{{ $processName }}
                port:
                  name: {{ include "primary.port" $config.web.port_maps }}
            pathType: ImplementationSpecific
            path: /
{{- else if eq $.Values.global.network.ingress_class "traefik" }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  annotations:
    dokku.com/managed: "true"
  labels:
    app.kubernetes.io/instance: {{ $.Values.global.app_name }}-{{ $processName }}-redirect-{{ $redirect.slug }}
    app.kubernetes.io/name: {{ $processName }}
    app.kubernetes.io/part-of: {{ $.Values.global.app_name }}
    {{ include "print.labels" (dict "config" $.Values.global "key" "traefik_middleware") | indent 4 }}
    {{ include "print.labels" (dict "config" $config "key" "traefik_middleware") | indent 4 }}
  name: {{ $.Values.global.app_name }}-{{ $processName }}-redirect-{{ $redirect.slug }}
  namespace: {{ $.Values.global.namespace }}
spec:
  redirectRegex:
    regex: {{ "^[^:]+://[^/]+(.*)" | quote }}
    replacement: {{ printf "%s://%s${1}" $scheme $redirect.destination | quote }}
    permanent: {{ $redirect.permanent }}
{{- range $edx, $entryPoint := list "web" "websecure" }}
{{- if and (eq $entryPoint "websecure") (not $config.web.tls.enabled) }}
{{- continue }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  annotations:
    dokku.com/managed: "true"
  labels:
    app.kubernetes.io/instance: {{ $.Values.global.app_name }}-{{ $processName }}-redirect-{{ $redirect.slug }}
    app.kubernetes.io/name: {{ $processName }}
    app.kubernetes.io/part-of: {{ $.Values.global.app_name }}
    {{ include "print.labels" (dict "config" $.Values.global "key" "traefik_ingressroute") | indent 4 }}
    {{ include "print.labels" (dict "config" $config "key" "traefik_ingressroute") | indent 4 }}
  name: {{ $.Values.global.app_name }}-{{ $processName }}-redirect-{{ $redirect.slug }}{{- if eq $entryPoint "websecure" }}-{{ $entryPoint }}{{- end }}
  namespace: {{ $.Values.global.namespace }}
spec:
  entryPoints:
  - {{ $entryPoint }}
  routes:
    - kind: Rule
      match: Host(`{{ $redirect.source }}`)
      middlewares:
        - name: {{ $.Values.global.app_name }}-{{ $processName }}-redirect-{{ $redirect.slug }}
          namespace: {{ $.Values.global.namespace }}
      services:
      - name: {{ $.Values.global.app_name }}-{{ $processName }}
        namespace: {{ $.Values.global.namespace }}
        passHostHeader: true
        port: {{ include "primary.port" $config.web.port_maps }}
        scheme: http
  {{- if eq $entryPoint "websecure" }}
  tls:
    {{- if $config.web.tls.use_imported_cert }}
    secretName: tls-{{ $.Values.global.app_name }}
    {{- else }}
    secretName: tls-{{ $.Values.global.app_name }}-{{ $processName }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
